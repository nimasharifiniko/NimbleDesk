version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nimbledesk-prod-db
    restart: always
    environment:
      POSTGRES_DB: nimbledesk
      POSTGRES_USER: nimbledesk_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod_secure_password_99}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbledesk_admin -d nimbledesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nimbledesk-prod-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://nimbledesk_admin:${POSTGRES_PASSWORD:-prod_secure_password_99}@db:5432/nimbledesk
      JWT_SECRET: ${JWT_SECRET:-super_secret_production_jwt_key_2025}
      OPENAI_API_KEY: ${OPENAI_API_KEY]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_prod_data: